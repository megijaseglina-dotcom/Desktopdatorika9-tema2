<html lang="lv">
<head>

<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }

img { max-width: 100%; height: auto; }

body { background-color: #f1f5f9; color: #222222; }
h1 { color: #1e3a5f; }

button { background-color: #172554; color: #ffffff; border: 0; }
</style>
</head>
<body>
<h1>Zvaigžņu spēle</h1>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Savāc piecas zvaigznes.</p>
  <p>Nospied “Sākt spēli”, lai sāktu spēli.</p>
</section>
<button>Sākt spēli</button>
</body>
</html>
